<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фото</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    #photo {
        width: 100vw;
        height: 100vh;
        display: none;
    }

    #start {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 24px;
        cursor: pointer;
        user-select: none;
    }
</style>
</head>

<body>

<div id="start">Нажми</div>

<img id="photo" src="https://wimg.rule34.xxx//images/2478/f3e9b835b6c8f14b5bedd1e60b2c3398.png?17806229">

<audio id="sound" src="sound.mp3" loop></audio>

<script>
document.getElementById("start").addEventListener("click", async () => {
    try {
        await document.documentElement.requestFullscreen();
    } catch {}

    document.getElementById("start").style.display = "none";
    document.getElementById("photo").style.display = "block";

    const audio = document.getElementById("sound");
    audio.play();
});
</script>

</body>
</html>
